<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #09090b; }
      .grid { stroke: #27272a; stroke-width: 2; opacity: 0.4; }
      .border { stroke: #3f3f46; stroke-width: 8; fill: none; }
      .accent-box { fill: #2563eb; }
      .icon-stroke { stroke: #ffffff; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .text-title { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 88px; fill: #ffffff; letter-spacing: 6px; }
      .text-sub { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 32px; fill: #a1a1aa; letter-spacing: 4px; }
    </style>
  </defs>
  
  <!-- Fondo Suizo Minimalista -->
  <rect class="bg" width="512" height="512" rx="64" />
  
  <!-- Rejilla de Fondo -->
  <line class="grid" x1="128" y1="0" x2="128" y2="512" />
  <line class="grid" x1="256" y1="0" x2="256" y2="512" />
  <line class="grid" x1="384" y1="0" x2="384" y2="512" />
  <line class="grid" x1="0" y1="128" x2="512" y2="128" />
  <line class="grid" x1="0" y1="256" x2="512" y2="256" />
  <line class="grid" x1="0" y1="384" x2="512" y2="384" />
  
  <!-- Borde nítido exterior -->
  <rect class="border" x="16" y="16" width="480" height="480" rx="52" />

  <!-- Bloque de Acento Azul Neón Suizo -->
  <rect class="accent-box" x="64" y="64" width="80" height="80" rx="16" />

  <!-- Icono Lineal Vectorial de Móvil / Escudo -->
  <rect class="icon-stroke" x="176" y="96" width="160" height="240" rx="24" />
  <line class="icon-stroke" x1="236" y1="136" x2="276" y2="136" />
  <circle cx="256" cy="286" r="14" fill="#ffffff" />
  
  <!-- Tipografía Principal FÁCIL -->
  <text x="256" y="410" text-anchor="middle" class="text-title">FÁCIL</text>
  <text x="256" y="452" text-anchor="middle" class="text-sub">01 / MINIMAL</text>
</svg>
