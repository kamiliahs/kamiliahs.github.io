<!-- Configuración View -->
<div id="configView" class="view-container hidden-view p-6">
    <h3 class="heading-lg mb-4">Configuración</h3>

    <!-- TEMA -->
    <div class="mb-8 pb-8 line-border">
        <p class="label-caps mb-3">Tema</p>
        <select id="configTheme" class="w-full border">
            <option value="light">Claro</option>
            <option value="dark">Oscuro</option>
            <option value="system">Sistema</option>
        </select>
    </div>

    <!-- UNIDADES DE MEDIDA -->
    <div class="mb-8 pb-8 line-border">
        <p class="label-caps mb-4">Unidades de Medida</p>
        <div id="unitsList" class="space-y-2 mb-4 max-h-[200px] overflow-y-auto"></div>
        <div class="space-y-2 mb-4">
            <input type="text" id="newUnitSymbol" placeholder="Símbolo (kg, l, etc)" class="w-full">
            <input type="text" id="newUnitName" placeholder="Nombre (Kilogramo, Litro, etc)" class="w-full">
            <button onclick="APP.addUnit()" class="w-full label-caps underline hover:text-teal">+ Agregar
                Unidad</button>
        </div>
    </div>

    <!-- EQUIVALENCIAS -->
    <div class="mb-8 pb-8 line-border">
        <p class="label-caps mb-4">Equivalencias</p>
        <div id="equivalencesList" class="space-y-2 mb-4 text-sm"></div>
        <div class="space-y-2">
            <select id="eqFromUnit" class="w-full border">
                <option value="">De --</option>
            </select>
            <input type="number" id="eqRatio" placeholder="Cantidad" step="0.01">
            <select id="eqToUnit" class="w-full border">
                <option value="">A --</option>
            </select>
            <button onclick="APP.addEquivalence()" class="w-full label-caps underline hover:text-teal">Crear
                Equivalencia</button>
        </div>
    </div>

    <!-- RESPALDO Y DATOS -->
    <div class="mb-8 pb-8 line-border">
        <p class="label-caps mb-4 text-teal">Respaldo y Datos (Backup)</p>
        <div class="space-y-4">
            <button onclick="APP.exportAppData()"
                class="w-full label-caps underline hover:text-teal font-black text-left text-[10px] uppercase tracking-widest transition-colors">
                ⬇ EXPORTAR BACKUP (.JSON)
            </button>
            <div class="relative">
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="APP.importAppData(event)">
                <button onclick="document.getElementById('importFile').click()"
                    class="w-full label-caps underline hover:text-teal font-black text-left text-[10px] uppercase tracking-widest transition-colors">
                    ⬆ IMPORTAR BACKUP (SELECCIONAR)
                </button>
            </div>
            <p class="text-[8px] text-muted opacity-60 uppercase font-black tracking-wider shadow-sm">Atención: La
                importación sobrescribirá toda la información actual.</p>
        </div>
    </div>

    <!-- BOTONES -->
    <div class="flex gap-4">
        <button onclick="APP.saveSettings()"
            class="w-1/2 btn-primary font-bold py-4 uppercase text-[10px] tracking-widest">Guardar</button>
        <button onclick="APP.switchView('pos')" class="w-1/2 label-caps btn-secondary py-4">Cancelar</button>
    </div>
</div>
